# ── Application ──
spring.application.name=PharmaStock Pro
server.port=8080
server.servlet.context-path=/

# ── Base de données PostgreSQL ──
spring.datasource.url=jdbc:postgresql://localhost:5432/pharmastock
spring.datasource.username=postgres
spring.datasource.password=khadija
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Flyway (migrations) ──
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT ──
app.jwt.secret=PharmaStockProSecretKey2024VeryLongAndSecureKeyForJWTSigning!@#$%
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# ── CORS ──
app.cors.allowed-origins=http://localhost:3000

# ── Pagination ──
spring.data.web.pageable.default-page-size=15
spring.data.web.pageable.max-page-size=100

# ── Logging ──
logging.level.ma.pharmacie=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/pharmastock.log
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Swagger ──
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
